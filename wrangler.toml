name = "satispay-ynab-import"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

# Non-secret deployment settings live in Git. Keep production values
# for YNAB_WRITE_ENABLED and YNAB_IMPORT_FROM unchanged.
[vars]
YNAB_WRITE_ENABLED = "true"
YNAB_IMPORT_FROM = "2026-10-11"

# Configure these four as Cloudflare Worker Secrets, never in Git:
# UPLOAD_TOKEN, YNAB_TOKEN, YNAB_PLAN_ID, YNAB_ACCOUNT_ID
# Wrangler preserves existing Worker Secrets during normal deployments.

# Worker Previews are isolated from production vars and secrets.
# Keep write operations disabled and never point Previews at actual YNAB accounts.
# /health needs no credentials; authenticated smoke tests require a separate
# Preview-only UPLOAD_TOKEN secret configured in Cloudflare.
[previews.vars]
YNAB_WRITE_ENABLED = "false"
YNAB_PLAN_ID = "00000000-0000-0000-0000-000000000000"
YNAB_ACCOUNT_ID = "00000000-0000-0000-0000-000000000000"
YNAB_IMPORT_FROM = "2026-10-11"
