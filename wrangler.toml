name = "satispay-ynab-import"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Non-secret runtime configuration is versioned in Git.
# All values in [vars] will be applied by Wrangler during deployment.
[vars]
YNAB_WRITE_ENABLED = "false"

# Add these only after retrieving the actual IDs and agreeing on the
# first date that should be imported. Do NOT commit placeholders.
# YNAB_PLAN_ID = "<real plan UUID>"
# YNAB_ACCOUNT_ID = "<real Satispay account UUID>"
# YNAB_IMPORT_FROM = "YYYY-MM-DD"

# Secrets must ONLY be configured in Cloudflare, never in this file:
# UPLOAD_TOKEN and YNAB_TOKEN
