# Fork-safe sample. Copy into wrangler.toml and customize before deployment.
name = "my-satispay-ynab-import"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Non-secret variables; set these to your own YNAB plan/account IDs.
[vars]
YNAB_WRITE_ENABLED = "false"
YNAB_PLAN_ID = "<your-plan-id>"
YNAB_ACCOUNT_ID = "<your-satispay-account-id>"
YNAB_IMPORT_FROM = "2026-01-01"

# Preview is always read-only; no production YNAB account identifiers here.
[previews.vars]
YNAB_WRITE_ENABLED = "false"
YNAB_PLAN_ID = "00000000-0000-0000-0000-000000000000"
YNAB_ACCOUNT_ID = "00000000-0000-0000-0000-000000000000"
YNAB_IMPORT_FROM = "2026-01-01"
