# Fork-safe sample. Copy into wrangler.toml and customize before deployment.
name = "my-satispay-ynab-import"
main = "src/main.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[observability]
enabled = false
head_sampling_rate = 1

# Safe defaults. Configure UPLOAD_TOKEN, YNAB_TOKEN, YNAB_PLAN_ID,
# and YNAB_ACCOUNT_ID as Worker Secrets (or in local .dev.vars).
[vars]
YNAB_WRITE_ENABLED = "false"
YNAB_IMPORT_FROM = "2026-01-01"

# Failed authentication attempts per client address, in each Cloudflare location.
# namespace_id is an account-wide counter id. period must be 10 or 60.
# Change the id if this account already uses 1001.
[[ratelimits]]
name = "AUTH_FAILURE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Preview is always read-only; no production YNAB account identifiers here.
[previews.vars]
YNAB_WRITE_ENABLED = "false"
YNAB_PLAN_ID = "00000000-0000-0000-0000-000000000000"
YNAB_ACCOUNT_ID = "00000000-0000-0000-0000-000000000000"
YNAB_IMPORT_FROM = "2026-01-01"

# ratelimits are not inherited by Previews. Keep this id distinct from production.
[[previews.ratelimits]]
name = "AUTH_FAILURE_LIMITER"
namespace_id = "1002"

  [previews.ratelimits.simple]
  limit = 10
  period = 60
